spring.application.name=DilzJackets

server.port=${PORT:8080}

# Supabase Session Pooler URL (5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}

# Supabase Credentials (Loaded securely via environment variable / .env)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Validations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep pool small for Supabase Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Recycle connections every 10 minutes (600,000 ms) before Supabase drops them
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.connection-timeout=20000

# Security / JWT Configuration
jwt.secret=${JWT_SECRET:yourSuperSecretKeyHere000123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# CORS Allowed Origin Patterns
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,*}